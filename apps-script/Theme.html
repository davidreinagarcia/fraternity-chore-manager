<!-- Shared Google-style visual layer. Included last in <head> of every light app via <?!= include('Theme') ?>
     so it overrides each page's own tokens. Style only: no layout changes. Chapter colour stays as --primary. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f9fa;
    --card: #ffffff;
    --card-bg: #ffffff;
    --border: #dadce0;
    --text: #202124;
    --muted: #5f6368;
    --green: #188038;   --green-bg: #e6f4ea;
    --red: #d93025;     --red-bg: #fce8e6;
    --yellow: #b06000;  --yellow-bg: #fef7e0;
    --radius: 8px;
    --shadow: none;
    --elev-1: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15);
    --elev-3: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
    --tint: color-mix(in srgb, var(--primary) 10%, #ffffff);
    --hover: #f1f3f4;
    --font: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  }
  html, body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--text); }
  button, input, select, textarea { font-family: inherit; }
  h1, h2, h3 { font-weight: 500; letter-spacing: 0; }

  /* ---- Top bars: flat white, hairline border ---- */
  #topbar, header, .topbar { background: #fff; color: var(--text); border-bottom: 1px solid var(--border); }
  #topbar h1, header h1, .topbar h1 { color: var(--text); font-weight: 500; letter-spacing: 0; }
  #topbar .meta, header p, .topbar p { color: var(--muted); }
  .top-btn { background: #fff; color: var(--primary); border: 1px solid var(--border); border-radius: 4px; font-weight: 500; }
  .top-btn:hover { background: var(--hover); }

  /* ---- Sidebar ---- */
  #sb, #sb-admin { background: #fff; border-right: 1px solid var(--border); }
  #sb-admin .sb-back { border: 1px solid var(--border); color: var(--primary); font-weight: 500; }
  .sb-hdr { border-bottom: 1px solid var(--border); }
  .sb-chapter { color: var(--text); font-weight: 500; font-size: .85rem; }
  .nl { color: var(--muted); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
  .ni { color: #3c4043; font-weight: 500; border-radius: 4px; }
  .ni:hover { background: var(--hover); color: var(--text); }
  .ni.on { background: var(--tint); color: var(--primary); font-weight: 700; }
  .tog { background: #fff; border-top: 1px solid var(--border); color: var(--muted); }
  .tog:hover { background: var(--hover); }

  /* ---- Section tabs: Google underline tabs ---- */
  .sub-nav { background: transparent; box-shadow: none; border-radius: 0; padding: 0; gap: 0; border-bottom: 1px solid var(--border); }
  .sub-btn { flex: 0 0 auto; border-radius: 0; padding: 12px 16px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .sub-btn:hover:not(.active) { background: var(--hover); color: var(--text); }
  .sub-btn.active { background: transparent; color: var(--primary); border-bottom-color: var(--primary); }

  /* ---- Surfaces ---- */
  .card, .stat-card, .admin-card, .admin-section, .pin-card, .ev-card, .chore-card {
    background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: none;
  }
  .card-header, .admin-section-header { background: #fff; }
  .card-header h2, .admin-section-header h2 { font-weight: 500; font-size: 1rem; }
  .stat-card .label { text-transform: none; font-weight: 500; letter-spacing: 0; font-size: .8rem; }
  .stat-card .value { font-weight: 400; font-size: 1.75rem; color: var(--text); }
  .admin-card h3 { font-weight: 500; }
  .chore-card, .chore-card:hover { transform: none; box-shadow: none; }

  /* ---- Tables ---- */
  .data-table th { background: #fff; color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: .8rem; border-bottom: 1px solid var(--border); }
  .data-table th:hover { background: var(--hover); }
  .data-table tr:hover td { background: var(--hover); }
  .data-table td { border-bottom: 1px solid #ebedf0; }

  /* ---- Chips / badges ---- */
  .badge { border-radius: 4px; text-transform: none; font-weight: 500; font-size: .75rem; padding: 2px 8px; letter-spacing: 0; }
  .badge-pending, .badge-inactive-m { background: #f1f3f4; color: var(--muted); }
  .badge-associate, .badge-assoc-m, .mm-stat-blue { background: #e8f0fe; color: #1967d2; }
  .badge-active-m { background: var(--green-bg); color: var(--green); }
  .badge-alumni-m, .mm-stat-gold { background: var(--yellow-bg); color: var(--yellow); }
  .mm-stat-chip, .summary-pill { border-radius: 4px; font-weight: 500; }

  /* ---- Buttons: flat, 4px, 500 weight ---- */
  .btn-primary, .btn-danger, .btn-outline, .action-btn, .btn-filter, .btn-gold {
    border-radius: 4px; font-weight: 500; letter-spacing: .01em; box-shadow: none;
  }
  .btn-primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); }
  .btn-primary:hover { filter: brightness(1.12); box-shadow: var(--elev-1); }
  .btn-danger { background: var(--red); color: #fff; border: 1px solid var(--red); }
  .btn-outline { background: #fff; color: var(--primary); border: 1px solid var(--border); }
  .btn-outline:hover { background: var(--tint); border-color: var(--primary); }
  .btn-filter { background: #fff; color: var(--muted); border: 1px solid var(--border); }
  .btn-filter:hover { background: var(--hover); }
  .btn-filter.active { background: var(--tint); color: var(--primary); border-color: var(--primary); }
  .action-btn:hover { opacity: 1; filter: brightness(.96); }
  .btn-verify { border-color: #ceead6; }
  .btn-fail { border-color: #f6c5c0; }
  .btn-photo { background: #e8f0fe; color: #1967d2; border-color: #d2e3fc; }
  #pin-btn { background: var(--primary); color: #fff; border-radius: 4px; font-weight: 500; }

  /* ---- Inputs ---- */
  select, textarea, input[type="text"], input[type="number"], input[type="date"], input[type="time"],
  input[type="email"], input[type="tel"], input[type="password"], input[type="search"], input[type="url"],
  .inline-input, .config-val-input, .search-box {
    border: 1px solid var(--border); border-radius: 4px; background: #fff; color: var(--text);
  }
  select:focus, textarea:focus, input:focus, .inline-input:focus, .config-val-input:focus, .search-box:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary);
  }
  #pin-input { border: 1px solid var(--border); border-radius: 4px; }

  /* ---- Overlays ---- */
  .modal-overlay { background: rgba(32,33,36,.6); }
  .modal { border-radius: 8px; box-shadow: var(--elev-3); }
  .modal h3 { font-weight: 500; }
  .ctx-menu { border: none; border-radius: 4px; box-shadow: var(--elev-3); }
  .ctx-item:hover { background: var(--hover); }
  .notes-panel { border-left: 1px solid var(--border); box-shadow: var(--elev-3); }
  .notes-panel-header { background: #fff; color: var(--text); border-bottom: 1px solid var(--border); }
  .notes-panel-header h3 { font-weight: 500; }
  .notes-add-form { background: #fff; }
  .note-item { border-radius: 4px; }
  .note-handoff { background: var(--yellow-bg); }
  .note-general { background: #f8f9fa; }
  #toast { background: #323232; border-radius: 4px; font-weight: 400; box-shadow: var(--elev-3); }
  .compliance-bar { border-radius: 2px; }
  .compliance-fill { border-radius: 2px; }

  /* ---- PIN screen ---- */
  #pin-screen { background: var(--bg); }
  .pin-card { box-shadow: none; padding: 40px 32px; }
  .pin-card h2 { color: var(--text); }

  /* ---- Public mobile forms (chore photo, signature, forms): Google Forms look ---- */
  body > .card { border-top: 8px solid var(--primary); box-shadow: none; }
  .header .badge { background: var(--tint); color: var(--primary); border-radius: 4px; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: .75rem; }
  .header h1 { font-weight: 400; }
  .header .due { border-radius: 4px; }
</style>
